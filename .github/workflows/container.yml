name: Build container
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated image to GHCR
        type: boolean
        default: false
      tag:
        description: Image tag (use a release version or preview)
        type: string
        default: preview
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Choose image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag || 'preview' }}
        run: |
          [[ "$INPUT_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || exit 1
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-qemu-action@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish
      - name: Build local smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hobbyfiles:ci
          cache-from: |
            type=gha,scope=hobbyfiles-smoke
            type=gha
          cache-to: type=gha,scope=hobbyfiles-smoke,mode=max
      - name: Check preview dependencies and isolated service
        run: |
          docker run --rm hobbyfiles:ci node /opt/hobbyfiles/scripts/check-preview-tools.js
          docker run --rm hobbyfiles:ci node /opt/hobbyfiles/scripts/check-torrent-runtime.js
          docker network create hobbyfiles-ci
          docker run -d --name hobbyfiles-redis --network hobbyfiles-ci redis:7-alpine
          secret=$(openssl rand -hex 32)
          docker run -d --name hobbyfiles-app --network hobbyfiles-ci \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:18080:8080 \
            -e REDIS_URL=redis://hobbyfiles-redis:6379 -e HOBBYFILES_SECRET="$secret" hobbyfiles:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs hobbyfiles-app
          exit 1
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        id: publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=hobbyfiles-multiarch
            type=gha
          cache-to: type=gha,scope=hobbyfiles-multiarch,mode=max
      - name: Verify published architectures
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw | jq -e '
            (.manifests | any(.platform.os == "linux" and .platform.architecture == "amd64")) and
            (.manifests | any(.platform.os == "linux" and .platform.architecture == "arm64"))'
          echo "Published: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up smoke containers
        if: always()
        run: |
          docker rm -f hobbyfiles-app hobbyfiles-redis || true
          docker network rm hobbyfiles-ci || true
