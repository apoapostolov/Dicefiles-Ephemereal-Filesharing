name: Validate Dicefiles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils firejail
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn audit:production
      - run: yarn lint
      - run: yarn test:unit --runInBand --silent
      - run: yarn prestart
